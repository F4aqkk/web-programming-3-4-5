<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация студента</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 40px 16px; }
        form { max-width: 400px; margin: 0 auto; background: #fff; border-radius: 12px;
               padding: 28px 32px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
        h1 { margin-top: 0; font-size: 24px; }
        label { display: block; margin: 12px 0 4px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { margin-top: 20px; width: 100%; padding: 10px; border: 0; border-radius: 6px;
                 background: #1565c0; color: #fff; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
<form action="process.php" method="POST">
    <h1>Регистрация студента</h1>

    <label for="firstname">Имя</label>
    <input type="text" id="firstname" name="firstname">

    <label for="lastname">Фамилия</label>
    <input type="text" id="lastname" name="lastname">

    <label for="age">Возраст</label>
    <input type="number" id="age" name="age">

    <label for="group">Группа</label>
    <input type="text" id="group" name="group">

    <button type="submit">Зарегистрировать</button>
</form>
</body>
</html>
